services:
  portal:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
      DJANGO_SECURE_COOKIES: "${DJANGO_SECURE_COOKIES:-0}"
      DJANGO_SECURE_SSL_REDIRECT: "${DJANGO_SECURE_SSL_REDIRECT:-0}"
      DJANGO_TRUST_PROXY: "${DJANGO_TRUST_PROXY:-0}"
      OIDC_PROVIDERS: "${OIDC_PROVIDERS:-[]}"
      TEAMS_GRAPH_ONLY: "${TEAMS_GRAPH_ONLY:-1}"
      TEAMS_BOT_APP_ID: "${TEAMS_BOT_APP_ID:-}"
      TEAMS_BOT_APP_PASSWORD: "${TEAMS_BOT_APP_PASSWORD:-}"
      TEAMS_BOT_TENANT_ID: "${TEAMS_BOT_TENANT_ID:-}"
      TEAMS_BOT_PROVIDER_ID: "${TEAMS_BOT_PROVIDER_ID:-}"
      SQLITE_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/media
    volumes:
      - sqlite_data:/app/data
      - django_media:/app/media
    restart: unless-stopped

volumes:
  sqlite_data:
  django_media:
